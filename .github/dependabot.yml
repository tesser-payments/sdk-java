# Dependency updates are opened as PRs rather than applied automatically: this
# is a signing SDK, and a Jackson or Bouncy Castle bump is a change to what gets
# put on the wire, so it goes through review and the parity gate like any other
# change.
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Routine minor/patch churn is batched into one weekly PR; the parity
      # gate and API lockfile in CI are what actually vouch for it. Majors
      # still arrive as individual PRs.
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        exclude-patterns:
          # The crypto core of the SDK: keep its bumps as dedicated PRs so a
          # Bouncy Castle change is always an intentional, visible review.
          - "org.bouncycastle:*"
    ignore:
      # Newer versions drop the SonatypeHost API our publish config uses (PR
      # #16 failed CI on exactly this, at 0.37.0); upgrading is
      # a deliberate Central Portal migration, not a version bump. Remove this
      # rule when that migration is scheduled.
      - dependency-name: "com.vanniktech.maven.publish"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Actions are pinned by commit SHA in the workflows. Dependabot understands
    # that form and rewrites the SHA while keeping the `# vX.Y.Z` comment, so
    # pinning does not have to be traded away to get updates.
    open-pull-requests-limit: 5
    groups:
      # Same batching rationale as gradle: one weekly PR for routine bumps.
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
