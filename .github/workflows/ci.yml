name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Build + test + lint + binary-compat check
        # :fixtures is excluded: it needs the Kotlin SDK in mavenLocal, which CI
        # has no reason to build. Fixtures are committed; regenerate them locally.
        run: ./gradlew :sdk:build spotlessCheck apiCheck --no-daemon --stacktrace
      - name: Compile the examples
        # The examples are the least-verified part of the deliverable -- the two
        # rebalance-step ones are compile-verified only. If CI does not even
        # compile them, a public-API change that breaks an example ships green.
        run: |
          ./gradlew \
            :examples:create-wallet:build \
            :examples:sign-rebalance-step-webhooks:build \
            :examples:sign-rebalance-step-polling:build \
            --no-daemon --stacktrace
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            sdk/build/reports/tests/
            sdk/build/test-results/
